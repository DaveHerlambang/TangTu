<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      TangTu's web app (0.6.0, docs/SPEC.md §13.9): installable from the iPhone's Home Screen. viewport-fit=cover
      lets the safe-area insets reach the app; maximum-scale stops iOS zooming into a field on focus (pinch zoom
      still works on iOS).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Tanggal Tua: a private money tracker on your own Supabase project." />
    <meta name="theme-color" content="#FCF6F9" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TangTu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* The splash colour until the app draws (as on the phone), no rubber-band past the app, no tap flash. */
        background-color: #fcf6f9;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      /* Text fields draw their own focus ring (TextField's border); buttons keep the browser's for the keyboard. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        0.6.3: in Safari on the iPhone, 100% is the height with the browser's toolbars hidden, so the bottom of the
        app (the Home | Charts tabs) sat under the toolbar. dvh follows what is actually visible as the toolbars come
        and go; 100% stays for browsers without it.
      */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <noscript>TangTu needs JavaScript.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // The service worker (public/sw.js) keeps the app's files so it opens fast and shows "Can't reach your data"
      // offline instead of the browser's error page. It never touches Supabase requests.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
